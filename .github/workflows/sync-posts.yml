name: Sincronizar críticas desde Sheets

on:
  schedule:
    - cron: '*/5 * * * *' # cada 5 minutos (mínimo permitido por GitHub)
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: sync-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar posts nuevos desde la hoja
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node scripts/sync-from-sheet.mjs

      - name: Regenerar índice
        run: node scripts/build-index.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ versions/ posts.js posts.json
          git diff --staged --quiet || git commit -m "Nuevas críticas desde el formulario"
          git push
