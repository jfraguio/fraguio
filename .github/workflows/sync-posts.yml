name: Sincronizar críticas desde Sheets

on:
  schedule:
    - cron: '*/5 * * * *' # red de seguridad (el disparo real es el repository_dispatch)
  repository_dispatch:
    types: [nueva-critica] # lanzado por el Apps Script del formulario
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: sync-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esperar a que Google refresque el CSV publicado
        if: github.event_name == 'repository_dispatch'
        run: sleep 180

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar posts nuevos desde la hoja
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node scripts/sync-from-sheet.mjs

      - name: Regenerar índice
        run: node scripts/build-index.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ versions/ posts.js posts.json index.html
          git diff --staged --quiet || git commit -m "Nuevas críticas desde el formulario"
          git pull --rebase origin main
          git push
