<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex" />
  <title>Administración — Fraguío</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="brand">Fraguío</header>

  <main class="admin">
    <div class="admin__box">
      <h1 class="admin__title">Administración</h1>
      <form id="admin-form" class="admin__form">
        <input
          type="password"
          id="admin-pass"
          class="admin__input"
          placeholder="Contraseña"
          aria-label="Contraseña"
          autofocus
          autocomplete="current-password"
        />
        <button type="submit" class="admin__submit">Entrar</button>
      </form>
      <p id="admin-error" class="admin__error" hidden>Contraseña incorrecta.</p>
    </div>
    <a class="admin__back" href="../">← Volver</a>
  </main>

  <script>
    document.getElementById('admin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('admin-pass').value;
      const errorEl = document.getElementById('admin-error');
      errorEl.hidden = true;
      try {
        const cfg = await (await fetch('../admin.json', { cache: 'no-store' })).json();
        const b = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b(cfg.salt), iterations: 310000, hash: 'SHA-256' },
          baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        const url = new TextDecoder().decode(
          await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(cfg.iv) }, key, b(cfg.data))
        );
        window.location.href = url;
      } catch {
        errorEl.hidden = false; // AES-GCM falla la autenticación si la clave es incorrecta
      }
    });
  </script>
</body>
</html>
